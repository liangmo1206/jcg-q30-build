name: Build ImmortalWrt for JCG Q30 Pro (mt7981)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    defaults:
      run:
        working-directory: openwrt

    steps:
      - name: 1. 释放磁盘空间
        working-directory: .
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/lib/android \
                      /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost 2>/dev/null || true
          sudo apt-get clean
          echo "===== 可用空间 ====="
          df -h /

      - name: 2. 获取上游源码到 openwrt/
        uses: actions/checkout@v4
        with:
          repository: hanwckf/immortalwrt-mt798x
          ref: openwrt-21.02
          path: openwrt
          fetch-depth: 1

      - name: 3. 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++ gawk git \
            libelf-dev libncurses5-dev libncursesw5-dev libssl-dev \
            python3 python3-distutils python3-setuptools \
            rsync unzip wget zlib1g-dev file time

      - name: 4. 更新 feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 4.5 用官方 26.11.9 预编译包替换 feeds 的 xray-core
        run: |
          # 21.02 的 Go 工具链编不了新版 Xray，改为安装官方 arm64 静态二进制；
          # 包名仍为 xray-core，PassWall 的依赖和组件检测都能正常识别。
          rm -rf package/feeds/packages/xray-core
          mkdir -p package/xray-core/files
          # 包定义以 base64 内联，避免网页编辑把 recipe 的 TAB 变成空格
          echo '' \
            | base64 -d > package/xray-core/Makefile
          grep -qP '^\t' package/xray-core/Makefile || { echo "❌ Makefile 缩进不是 TAB"; exit 1; }
          head -4 package/xray-core/Makefile
          curl -fsSL -o /tmp/xray.zip \
            https://github.com/XTLS/Xray-core/releases/download/v26.11.9/Xray-linux-arm64-v8a.zip
          unzip -o -q /tmp/xray.zip -d package/xray-core/files
          chmod +x package/xray-core/files/xray
          ls -lh package/xray-core/files
          file package/xray-core/files/xray
          test -f package/xray-core/files/geoip.dat   || { echo "❌ 缺少 geoip.dat"; exit 1; }
          test -f package/xray-core/files/geosite.dat || { echo "❌ 缺少 geosite.dat"; exit 1; }
          echo "✅ xray 预编译包就位"

      - name: 4.6 型号改名为 Q30 Pro（只改显示名，不动 compatible）
        run: |
          # 硬件实际是 Q30 Pro，上游把型号写成了 Q30 / MR3000D-CIq。
          # 这两处只影响界面与元数据里显示的名字：
          #   ① DTS 的 model      → /tmp/sysinfo/model，LuCI 顶栏显示的就是它
          #   ② image 的 DEVICE_MODEL → 镜像元数据里的 model 字段
          # 关键的 compatible "jcg,q30" 与 SUPPORTED_DEVICES 一律保持原样，
          # 否则 sysupgrade 会因为设备不匹配而拒绝刷机。
          DTS=target/linux/mediatek/files-5.4/arch/arm64/boot/dts/mediatek/mt7981-jcg-q30.dts
          sed -i 's|model = "[^"]*Q30[^"]*";|model = "JCG Q30 Pro";|' "$DTS"
          sed -i 's|^  DEVICE_MODEL := Q30$|  DEVICE_MODEL := Q30 Pro|' target/linux/mediatek/image/mt7981.mk

          echo "===== 改名结果 ====="
          grep -n 'model = ' "$DTS"
          grep -nE 'DEVICE_(VENDOR|MODEL|DTS)|SUPPORTED_DEVICES' target/linux/mediatek/image/mt7981.mk | sed -n '/Q30/,+3p'
          # 闸门：型号必须改到，兼容串必须没被碰
          grep -q 'model = "JCG Q30 Pro";' "$DTS" || { echo "❌ DTS model 未改为 Q30 Pro"; exit 1; }
          grep -q '^  DEVICE_MODEL := Q30 Pro$' target/linux/mediatek/image/mt7981.mk || { echo "❌ DEVICE_MODEL 未改为 Q30 Pro"; exit 1; }
          grep -q 'compatible = "jcg,q30"' "$DTS" || { echo "❌ compatible 被误改，这会破坏 sysupgrade 兼容性"; exit 1; }
          grep -q 'SUPPORTED_DEVICES := jcg,q30' target/linux/mediatek/image/mt7981.mk || { echo "❌ SUPPORTED_DEVICES 被误改"; exit 1; }
          echo "✅ 型号已改为 Q30 Pro，兼容串保持 jcg,q30"

      - name: 5. 生成配置（PassWall + 在用服务 + 广告拦截 + 音乐解锁）
        run: |
          cp defconfig/mt7981-ax3000.config .config

          # ---------- PassWall 本体（版本与本机一致 4.68-1）----------
          # INCLUDE_Xray 拉 xray-core（已被 4.5 换成 26.11.9 预编译包）
          echo 'CONFIG_PACKAGE_luci-app-passwall=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray=y' >> .config
          echo 'CONFIG_PACKAGE_luci-i18n-passwall-zh-cn=y' >> .config
          # 只加客户端（连节点用），不加服务端
          echo 'CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Libev_Client=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-passwall_INCLUDE_ShadowsocksR_Libev_Client=y' >> .config
          for opt in V2ray V2ray_Plugin V2ray_Geodata Haproxy Brook \
                     Shadowsocks_Libev_Server \
                     Shadowsocks_Rust_Client Shadowsocks_Rust_Server \
                     ShadowsocksR_Libev_Server \
                     Simple_Obfs Trojan_Plus Trojan_GO tuic_client \
                     Hysteria NaiveProxy Xray_Plugin; do
            echo "CONFIG_PACKAGE_luci-app-passwall_INCLUDE_${opt}=n" >> .config
          done

          # ---------- 补齐本机真实在用的服务 ----------
          # alist / frpc / zerotier / ddns-go / netdata 在本机都是空配置没跑起来，
          # easymesh 只有 LuCI 空壳、后端包不存在，一律不编入。
          for p in \
            luci-app-qos qos-scripts luci-app-wol luci-app-arpbind \
            luci-app-ramfree luci-app-filetransfer luci-app-uhttpd \
            luci-app-nlbwmon nlbwmon dawn default-settings-chn ; do
            echo "CONFIG_PACKAGE_${p}=y" >> .config
          done

          # ---------- 无线：必须与现固件同一套架构 ----------
          # 本机用的是 wifi-profile + luci-app-mtk：以 /etc/wireless/*.dat 为唯一事实来源，
          # LuCI 直接改 dat（bypass uci），没有 /etc/config/wireless。
          # 上游 defconfig 默认的 mtwifi-cfg 是另一套架构：以 /etc/config/wireless 为准，
          # 首次启动会自动生成 ImmortalWrt-2.4G/5G + 无密码的默认 SSID，
          # 并把 dat 里的 SSID/密码覆盖掉 —— 两套互斥（mtwifi-cfg 带 @!PACKAGE_luci-app-mtk），
          # 选错就等于刷完丢 WiFi 配置，所以这里显式锁死。
          echo 'CONFIG_PACKAGE_wifi-profile=y' >> .config
          echo 'CONFIG_PACKAGE_wifi-dats=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-mtk=y' >> .config
          echo 'CONFIG_WIFI_NORMAL_SETTING=y' >> .config
          echo '# CONFIG_PACKAGE_mtwifi-cfg is not set' >> .config
          echo '# CONFIG_PACKAGE_luci-app-mtwifi-cfg is not set' >> .config
          echo '# CONFIG_PACKAGE_luci-i18n-mtwifi-cfg-zh-cn is not set' >> .config
          # 驱动版本用上游默认 7.6.7.3（不改成 7.6.6.1：warp 硬件加速固定 2025-04 版，
          # 与旧驱动配对未经验证；而 wifi-dats 对两个版本只提供同一套 .dat 模板，
          # 现有 /etc/wireless/*.dat 在 7.6.7.3 下可直接使用）
          # 中文界面：luci-i18n-* 是 HIDDEN 包（DEFAULT:=LUCI_LANG_$(2)），
          # 直接写 CONFIG_PACKAGE_luci-i18n-xxx=y 会被 defconfig 忽略，
          # 必须打开语言开关，所有已选应用的中文包才会自动跟上。
          echo 'CONFIG_LUCI_LANG_zh_Hans=y' >> .config
          # 本机用的是 qos-scripts，不是 MTK 的 eqos，避免两套 tc 打架
          echo 'CONFIG_PACKAGE_luci-app-eqos-mtk=n' >> .config

          # ---------- 广告拦截：adblock（dnsmasq 层，不动 PassWall 的 DNS 链路）----------
          echo 'CONFIG_PACKAGE_luci-app-adblock=y' >> .config
          echo 'CONFIG_PACKAGE_luci-i18n-adblock-zh-cn=y' >> .config

          # ---------- 音乐会员解锁：官方 LuCI（依赖 node）----------
          echo 'CONFIG_PACKAGE_luci-app-unblockneteasemusic=y' >> .config

          make defconfig

          echo "===== 配置校验 ====="
          grep -E "jcg_q30=y|PACKAGE_luci-app-passwall=y|passwall_INCLUDE_(Xray|Shadowsocks_Libev_Client|ShadowsocksR_Libev_Client)=y" .config
          echo "--- xray / node ---"
          grep -E "^CONFIG_PACKAGE_(xray-core|node)=" .config || true
          echo "--- 新加的服务 ---"
          grep -E "^CONFIG_PACKAGE_(luci-app-adblock|luci-app-unblockneteasemusic|luci-app-qos|dawn|nlbwmon)=" .config || true
          echo "--- 无线架构（必须 wifi-profile + luci-app-mtk，且不能有 mtwifi-cfg）---"
          grep -E "^CONFIG_PACKAGE_(wifi-profile|wifi-dats|luci-app-mtk|mtwifi-cfg|luci-app-mtwifi-cfg)=" .config || true
          echo "--- 中文界面 ---"
          grep -E "^CONFIG_LUCI_LANG_zh_Hans=|^CONFIG_PACKAGE_(default-settings-chn|luci-i18n-base-zh-cn)=" .config || true
          echo "--- 确认没有混入 v2ray/haproxy ---"
          grep -E "^CONFIG_PACKAGE_(v2ray-core|haproxy)=y" .config && { echo "❌ 多余组件被带上"; exit 1; } || echo "OK: 未包含 v2ray/haproxy"

          # 缺任何一项直接失败，避免编译 2 小时后才发现固件缺东西
          for g in \
            "^CONFIG_PACKAGE_luci-app-passwall=y" \
            "^CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray=y" \
            "^CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Libev_Client=y" \
            "^CONFIG_PACKAGE_luci-app-passwall_INCLUDE_ShadowsocksR_Libev_Client=y" \
            "^CONFIG_PACKAGE_luci-app-adblock=y" \
            "^CONFIG_PACKAGE_luci-app-unblockneteasemusic=y" \
            "^CONFIG_PACKAGE_wifi-profile=y" \
            "^CONFIG_PACKAGE_luci-app-mtk=y" \
            "^CONFIG_LUCI_LANG_zh_Hans=y" \
            "^CONFIG_PACKAGE_luci-i18n-base-zh-cn=y" \
            "^CONFIG_PACKAGE_default-settings-chn=y" ; do
            grep -q "$g" .config || { echo "❌ 缺少配置项: $g"; exit 1; }
          done
          # 反向闸门：给不能同时选上 mtwifi-cfg，否则无线配置会被重置成默认开放 SSID
          if grep -qE "^CONFIG_PACKAGE_(mtwifi-cfg|luci-app-mtwifi-cfg)=y" .config; then
            echo "❌ 无线架构冲突：mtwifi-cfg 与 luci-app-mtk 不能共存"; exit 1
          fi
          grep -q "jcg_q30=y" .config || { echo "❌ jcg_q30 未启用"; exit 1; }
          echo "✅ 配置校验通过"

      - name: 5.5 注入默认 LAN 地址与 PassWall direct_ip
        run: |
          # files/ 的内容在打包镜像时会覆盖到 rootfs 最上层，
          # 优先级高于软件包自带的同名文件，而且不占 overlay。
          mkdir -p files/etc/uci-defaults files/usr/share/passwall/rules files/lib/upgrade/keep.d

          cat > files/etc/uci-defaults/99-zz-jcg-lan <<'EOS'
          #!/bin/sh
          # LAN 地址与本机现状保持一致（zz 开头，排在 default-settings 之后执行）
          uci set network.lan.ipaddr='192.168.123.1'
          uci set network.lan.netmask='255.255.255.0'
          uci commit network
          uci set dhcp.lan.start='100'
          uci set dhcp.lan.limit='150'
          uci commit dhcp
          exit 0
          EOS
          chmod +x files/etc/uci-defaults/99-zz-jcg-lan

          # PassWall 的直连 IP 规则。这个文件属于软件包、不归 /etc/config 管，
          # 所以 config 备份恢复不回来 —— 直接编进固件才不会再次丢失。
          cat > files/usr/share/passwall/rules/direct_ip <<'EOS'
          114.114.114.114
          114.114.115.115
          223.5.5.5
          223.6.6.6
          119.29.29.29
          180.76.76.76
          8.133.124.0/23
          EOS

          echo "===== 注入内容 ====="
          echo "--- uci-defaults ---"
          cat files/etc/uci-defaults/99-zz-jcg-lan
          echo "--- direct_ip ---"
          cat files/usr/share/passwall/rules/direct_ip

          # 让以后的每次 sysupgrade 都保留 /etc/wireless/（SSID/信道/功率全在这里）。
          # 现固件本来就带这条 keep 规则，所以这次刷机不会丢；写进新固件是为了以后不再依赖旧系统。
          cat > files/lib/upgrade/keep.d/wifi-profile <<'EOS'
          /etc/wireless/
          EOS
          echo "--- keep.d/wifi-profile ---"
          cat files/lib/upgrade/keep.d/wifi-profile

      - name: 6. 下载源码包
        run: |
          make download -j8
          make download -j8 || true

      - name: 7. 开始编译
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: 8. 收集固件
        run: |
          mkdir -p out
          find bin/targets/mediatek/mt7981 -type f -name "*jcg_q30*" -exec cp -v {} out/ \;
          find bin/targets/mediatek/mt7981 -maxdepth 1 -type f \( -name "*.manifest" -o -name "config.buildinfo" \) -exec cp -v {} out/ \; 2>/dev/null || true

          # 关键 ipk 也带进 artifact。
          # 踩过的坑：feed 里的包落在 bin/packages/<arch>/packages/，
          # 只有本地 package/ 目录下的包才在 bin/packages/<arch>/base/，
          # 所以不能写死 base/，用 find 全树找。
          find bin/packages -type f \( \
                 -name 'xray-core_*.ipk' \
                 -o -name 'shadowsocks-libev-ss-redir_*.ipk' \
                 -o -name 'shadowsocks-libev-ss-local_*.ipk' \
                 -o -name 'shadowsocksr-libev-ssr-redir_*.ipk' \
                 -o -name 'shadowsocksr-libev-ssr-local_*.ipk' \
                 -o -name 'adblock_*.ipk' \
               \) -exec cp -v {} out/ \;

          # 镜像内「实际安装」清单：build_dir 里的 opkg status 才是最权威的
          STATUS=$(ls build_dir/target-*/root-*/usr/lib/opkg/status 2>/dev/null | head -1)
          if [ -n "$STATUS" ]; then
            cp -v "$STATUS" out/packages-installed.txt
            echo "✅ 已导出镜像内安装清单"
          else
            echo "⚠️ 未找到 opkg status，退而用 .config 反推"
            grep -E "^CONFIG_PACKAGE_[A-Za-z0-9._+-]+=y$" .config | sed 's/^CONFIG_PACKAGE_//;s/=y$//' > out/packages-installed.txt
          fi

          echo "===== 产物 ====="
          ls -lh out

          echo "===== 镜像内关键组件核对 ====="
          FAIL=0
          for p in luci-app-passwall xray-core shadowsocks-libev-ss-redir shadowsocksr-libev-ssr-redir luci-app-adblock luci-app-unblockneteasemusic node wifi-profile wifi-dats luci-app-mtk; do
            if grep -q "^Package: ${p}$" out/packages-installed.txt 2>/dev/null; then
              echo "  ✅ ${p}"
            else
              echo "  ❌ ${p} 不在清单里"
              FAIL=1
            fi
          done
          echo "--- 清单里的 LuCI 应用 ---"
          grep "^Package: luci-app-" out/packages-installed.txt | sed 's/Package: //' | tr '\n' ' ' || true
          echo

          echo "===== 唯一硬性要求：必须有 sysupgrade 固件 ====="
          ls -lh bin/targets/mediatek/mt7981/*jcg_q30*squashfs-sysupgrade.bin || { echo "❌ 没有 sysupgrade 固件"; exit 1; }

          [ "$FAIL" -eq 0 ] || echo "⚠️ 有关键组件缺失，但仍上传产物供排查"
          echo "✅ 收集完成"

      - name: 9. 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-jcg_q30-pro
          path: openwrt/out/*
          if-no-files-found: error
