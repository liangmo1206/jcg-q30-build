name: Build ImmortalWrt for JCG Q30 (mt7981)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    defaults:
      run:
        working-directory: openwrt

    steps:
      - name: 1. 释放磁盘空间
        working-directory: .
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/lib/android \
                      /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost 2>/dev/null || true
          sudo apt-get clean
          echo "===== 可用空间 ====="
          df -h /

      - name: 2. 获取上游源码到 openwrt/
        uses: actions/checkout@v4
        with:
          repository: hanwckf/immortalwrt-mt798x
          ref: openwrt-21.02
          path: openwrt
          fetch-depth: 1

      - name: 3. 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++ gawk git \
            libelf-dev libncurses5-dev libncursesw5-dev libssl-dev \
            python3 python3-distutils python3-setuptools \
            rsync unzip wget zlib1g-dev file time

      - name: 4. 更新 feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 4.5 用官方 26.11.9 预编译包替换 feeds 的 xray-core
        run: |
          # 21.02 的 Go 工具链编不了新版 Xray，改为安装官方 arm64 静态二进制；
          # 包名仍为 xray-core，PassWall 的依赖和组件检测都能正常识别。
          rm -rf package/feeds/packages/xray-core
          mkdir -p package/xray-core/files
          # 包定义以 base64 内联，避免网页编辑把 recipe 的 TAB 变成空格
          echo '' \
            | base64 -d > package/xray-core/Makefile
          grep -qP '^\t' package/xray-core/Makefile || { echo "❌ Makefile 缩进不是 TAB"; exit 1; }
          head -4 package/xray-core/Makefile
          curl -fsSL -o /tmp/xray.zip \
            https://github.com/XTLS/Xray-core/releases/download/v26.11.9/Xray-linux-arm64-v8a.zip
          unzip -o -q /tmp/xray.zip -d package/xray-core/files
          chmod +x package/xray-core/files/xray
          ls -lh package/xray-core/files
          file package/xray-core/files/xray
          test -f package/xray-core/files/geoip.dat   || { echo "❌ 缺少 geoip.dat"; exit 1; }
          test -f package/xray-core/files/geosite.dat || { echo "❌ 缺少 geosite.dat"; exit 1; }
          echo "✅ xray 预编译包就位"

      - name: 5. 生成配置（jcg_q30 + PassWall 4.68-1 + SS/SSR 客户端）
        run: |
          cp defconfig/mt7981-ax3000.config .config
          # 上游 defconfig 不启用 PassWall，这里显式加上；版本与本机一致（4.68-1）
          # INCLUDE_Xray 拉 xray-core（已被 4.5 换成 26.11.9 预编译包）
          echo 'CONFIG_PACKAGE_luci-app-passwall=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray=y' >> .config
          echo 'CONFIG_PACKAGE_luci-i18n-passwall-zh-cn=y' >> .config
          # 只加客户端（连节点用），不加服务端
          echo 'CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Libev_Client=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-passwall_INCLUDE_ShadowsocksR_Libev_Client=y' >> .config
          # 其余重组件关掉：v2ray/haproxy/ss-rust/服务端等用不到，省固件体积
          for opt in V2ray V2ray_Plugin V2ray_Geodata Haproxy Brook \
                     Shadowsocks_Libev_Server \
                     Shadowsocks_Rust_Client Shadowsocks_Rust_Server \
                     ShadowsocksR_Libev_Server \
                     Simple_Obfs Trojan_Plus Trojan_GO tuic_client \
                     Hysteria NaiveProxy Xray_Plugin; do
            echo "CONFIG_PACKAGE_luci-app-passwall_INCLUDE_${opt}=n" >> .config
          done
          make defconfig
          echo "===== 配置校验 ====="
          grep -E "jcg_q30=y|PACKAGE_luci-app-passwall=y|passwall_INCLUDE_(Xray|Shadowsocks_Libev_Client|ShadowsocksR_Libev_Client)=y" .config
          echo "===== 确认 xray-core 被选中 ====="
          grep -E "^CONFIG_PACKAGE_xray-core=" .config || echo "⚠️ .config 里没有 xray-core 条目"
          echo "===== 确认没有混入 v2ray/haproxy ====="
          grep -E "^CONFIG_PACKAGE_(v2ray-core|haproxy)=y" .config && { echo "❌ 多余组件被带上"; exit 1; } || echo "OK: 未包含 v2ray/haproxy"
          # 缺任何一项直接失败，避免编译 3 小时后才发现固件缺东西
          grep -q "^CONFIG_PACKAGE_luci-app-passwall=y" .config || { echo "❌ PassWall 未启用"; exit 1; }
          grep -q "^CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray=y" .config || { echo "❌ PassWall 的 Xray 未启用"; exit 1; }
          grep -q "^CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Libev_Client=y" .config || { echo "❌ SS 客户端未启用"; exit 1; }
          grep -q "^CONFIG_PACKAGE_luci-app-passwall_INCLUDE_ShadowsocksR_Libev_Client=y" .config || { echo "❌ SSR 客户端未启用"; exit 1; }
          grep -q "jcg_q30=y" .config || { echo "❌ jcg_q30 未启用"; exit 1; }
          echo "✅ 配置校验通过"

      - name: 6. 下载源码包
        run: |
          make download -j8
          make download -j8 || true

      - name: 7. 开始编译
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: 8. 收集固件
        run: |
          mkdir -p out
          find bin/targets/mediatek/mt7981 -type f -name "*jcg_q30*" -exec cp -v {} out/ \;
          # 三个关键 ipk 一并带出 artifact，方便单独提取 / 刷机后重装
          cp -v bin/packages/*/base/xray-core_*.ipk out/ 2>/dev/null || true
          cp -v bin/packages/*/base/shadowsocks-libev-ss-redir_*.ipk out/ 2>/dev/null || true
          cp -v bin/packages/*/base/shadowsocksr-libev-ssr-redir_*.ipk out/ 2>/dev/null || true

          echo "===== 产物 ====="
          ls -lh out

          echo "===== 镜像内实际安装的组件（manifest）====="
          MAN=$(ls bin/targets/mediatek/mt7981/*jcg_q30*.manifest 2>/dev/null | head -1)
          if [ -n "$MAN" ]; then
            echo "manifest: $MAN"
            grep -E "^(xray-core|luci-app-passwall|luci-i18n-passwall|shadowsocks-libev|shadowsocksr-libev)" "$MAN" || echo "⚠️ manifest 里没找到预期的包"
          else
            echo "⚠️ 未找到 manifest"
          fi

          echo "===== xray ipk 内容粗查 ====="
          XRAY_IPK=$(ls bin/packages/*/base/xray-core_*.ipk 2>/dev/null | head -1)
          if [ -n "$XRAY_IPK" ]; then
            echo "xray 包：$XRAY_IPK"
            file "$XRAY_IPK"
            # 这个分支的 ipk 容器不是 ar（tar.gz 套 tar.gz），两种格式都试，只报告不阻断
            if tar tzf "$XRAY_IPK" >/dev/null 2>&1; then
              echo "容器格式：tar.gz"
              tar xzOf "$XRAY_IPK" ./data.tar.gz 2>/dev/null | tar tz 2>/dev/null | grep -E "usr/bin/xray|geoip.dat" || echo "⚠️ 包内未列出 xray 路径"
            else
              echo "容器格式：ar"
              ar p "$XRAY_IPK" data.tar.gz 2>/dev/null | tar tz 2>/dev/null | grep -E "usr/bin/xray|geoip.dat" || echo "⚠️ 包内未列出 xray 路径"
            fi
          else
            echo "⚠️ 未生成 xray-core ipk"
          fi

          ls -lh bin/packages/*/base/shadowsocks-libev-ss-redir_*.ipk bin/packages/*/base/shadowsocksr-libev-ssr-redir_*.ipk || echo "⚠️ SS/SSR 客户端 ipk 缺失"

          echo "===== 唯一硬性要求：必须有 sysupgrade 固件 ====="
          ls -lh bin/targets/mediatek/mt7981/*jcg_q30*squashfs-sysupgrade.bin || { echo "❌ 没有 sysupgrade 固件"; exit 1; }
          echo "✅ 收集完成"

      - name: 9. 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-jcg_q30
          path: openwrt/out/*
          if-no-files-found: error
